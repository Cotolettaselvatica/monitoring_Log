services:
  postgres:
    image: postgres:16-alpine
    container_name: catis-postgres-local
    restart: unless-stopped
    ports:
      - "${DB_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: counter
      POSTGRES_PASSWORD: CatisPg2026
      POSTGRES_DB: raspberry_counter
    volumes:
      - catis_pg_data:/var/lib/postgresql/data
      - ./init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U counter -d raspberry_counter"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  catis_pg_data:
